outputs:
  - name: 'pcb3d'
    comment: 'Intermediate PCB3D file used as input for Blender'
    type: pcb2blender_export
    dir: cad
    options:
      output: '%f.%x'

  - name: 'blender_3d_models'
    comment: '3D models via Blender (GLB, STL, OBJ, FBX)'
    type: blender_export
    dir: cad
    options:
      pcb3d: 'cad/%f.pcb3d'
      pcb_import:
        components: true
      outputs:
        - type: fbx
          output_file_name: '%f.fbx'
        - type: obj
          output_file_name: '%f.obj'
        - type: stl
          output_file_name: '%f.stl'
        - type: gltf
          output_file_name: '%f.glb'
